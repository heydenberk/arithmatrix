<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Grid cells (3x3 representing a puzzle) -->
  <g fill="rgba(255,255,255,0.95)" stroke="rgba(255,255,255,0.3)" stroke-width="2">
    <!-- Row 1 -->
    <rect x="64" y="64" width="110" height="110" rx="12"/>
    <rect x="194" y="64" width="110" height="110" rx="12"/>
    <rect x="324" y="64" width="110" height="110" rx="12"/>
    <!-- Row 2 -->
    <rect x="64" y="194" width="110" height="110" rx="12"/>
    <rect x="194" y="194" width="110" height="110" rx="12"/>
    <rect x="324" y="194" width="110" height="110" rx="12"/>
    <!-- Row 3 -->
    <rect x="64" y="324" width="110" height="110" rx="12"/>
    <rect x="194" y="324" width="110" height="110" rx="12"/>
    <rect x="324" y="324" width="110" height="110" rx="12"/>
  </g>

  <!-- Sample numbers -->
  <g fill="#667eea" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="119" y="124" font-size="56">3</text>
    <text x="249" y="124" font-size="56">1</text>
    <text x="379" y="124" font-size="56">2</text>
    <text x="119" y="254" font-size="56">2</text>
    <text x="249" y="254" font-size="56">3</text>
    <text x="379" y="254" font-size="56">1</text>
    <text x="119" y="384" font-size="56">1</text>
    <text x="249" y="384" font-size="56">2</text>
    <text x="379" y="384" font-size="56">3</text>
  </g>

  <!-- Cage indicators (small operation hints) -->
  <g fill="#4c51bf" font-family="system-ui" font-size="20" font-weight="600">
    <text x="76" y="84">6×</text>
    <text x="206" y="84">3+</text>
  </g>
</svg>
