<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=<ICON_VERSION> - bump on EVERY icon change, here and in the manifest
         icons in vite.config.ts (keep the two the same). Redrawing the art
         alone is not enough: an installed app's icon is baked in by the OS at
         install time, and Chrome only rebuilds its WebAPK when it notices the
         manifest differ - a changed URL is the signal it acts on, changed
         bytes at the same URL is not. Same trick as CORPUS_VERSION. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Arithmatrix" />
    <meta name="theme-color" content="#667eea" />
    <meta
      name="description"
      content="A challenging mathematical puzzle game with cage-based operations"
    />
    <title>Arithmatrix</title>

    <!-- Link previews. Puzzle URLs are shareable (?p=<index>), so a pasted
         link should show something. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arithmatrix" />
    <meta property="og:title" content="Arithmatrix" />
    <meta
      property="og:description"
      content="A challenging mathematical puzzle game with cage-based operations"
    />
    <meta property="og:url" content="https://heydenberk.com/arithmatrix/" />
    <meta property="og:image" content="https://heydenberk.com/arithmatrix/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arithmatrix" />
    <meta
      name="twitter:description"
      content="A challenging mathematical puzzle game with cage-based operations"
    />
    <meta name="twitter:image" content="https://heydenberk.com/arithmatrix/social-card.png" />
    <script>
      /*
       * Capture `beforeinstallprompt` here, before the app bundle loads.
       * Chrome fires it once, shortly after load, and the app's own listener
       * used to be registered inside a React effect - late enough (behind a
       * large bundle and a 7MB puzzle fetch) to miss the event entirely, after
       * which nothing could ever offer an install.
       *
       * preventDefault() suppresses Chrome's mini-infobar so the app can show
       * its own CTA and call prompt() at a moment of its choosing.
       */
      window.__installPrompt = null;
      // Sticky record of whether the event ever fired, for diagnostics: the
      // prompt above is cleared once used, but "did Chrome ever offer one?"
      // is the question worth answering when no install CTA shows up.
      window.__installPromptFired = false;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__installPrompt = event;
        window.__installPromptFired = true;
        window.dispatchEvent(new Event('installpromptchange'));
      });
      window.addEventListener('appinstalled', function () {
        window.__installPrompt = null;
        window.dispatchEvent(new Event('installpromptchange'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
